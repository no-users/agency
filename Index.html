<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad-Free PDF Compressor</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .container { border: 2px dashed #ccc; padding: 40px; text-align: center; width: 300px; }
        button { margin-top: 20px; padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>PDF Compressor</h2>
        <input type="file" id="pdfInput" accept="application/pdf">
        <button onclick="compressPDF()">Compress PDF</button>
        <p id="status"></p>
    </div>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    
    <script>
        async function compressPDF() {
            const fileInput = document.getElementById('pdfInput');
            const status = document.getElementById('status');
            
            if (fileInput.files.length === 0) return alert("File chunein!");
            
            status.innerText = "Processing...";

            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            
            // PDF load karna
            const { PDFDocument } = PDFLib;
            const pdfDoc = await PDFDocument.load(arrayBuffer);
            
            // Yahan PDF ko optimize/compress karne ka logic hoga
            // PDF-lib abhi structural changes karta hai
            const pdfBytes = await pdfDoc.save({ useObjectStreams: true });
            
            // Download process
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "compressed_" + file.name;
            link.click();
            
            status.innerText = "Done! Download shuru ho gaya.";
        }
    </script>
</body>
</html>
